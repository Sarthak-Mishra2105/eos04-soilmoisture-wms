# ImageMosaic index definition for the EOS-04 soil moisture time series.
# Each granule's acquisition time is parsed from its file name (see timeregex.properties)
# and stored in the "time" attribute, which backs the WMS TIME dimension.
TimeAttribute=time
Schema=*the_geom:Polygon,location:String,time:java.util.Date
PropertyCollectors=TimestampFileNameExtractorSPI[timeregex](time)
AbsolutePath=false
Caching=false
CanBeEmpty=false
Name=soil_moisture
